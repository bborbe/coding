name: Changelog Unreleased Fold Precheck

# Reusable workflow. Call it from the CONSUMING repo's own `pull_request` job:
#
#   # .github/workflows/changelog-unreleased-fold.yml  — in the consuming repo
#   name: Changelog Unreleased Fold Precheck
#   on:
#     pull_request:
#       # `edited` covers a retargeted base branch, which fires no other event:
#       # without it a PR retargeted to the guarded branch keeps a green check
#       # computed against its old base, and the merge that can fold is never
#       # prechecked. The title/body edits that also fire it are only cheap when
#       # the branch carries nothing pending: the guard exits before computing a
#       # merge unless the head's topmost heading is `## Unreleased` AND the
#       # base's is a released `## vX.Y.Z`. A PR with pending work pays a full
#       # merge-tree on each edit, which is the cost of not missing a retarget.
#       types: [opened, synchronize, reopened, edited]
#   jobs:
#     changelog-unreleased-fold:
#       uses: bborbe/coding/.github/workflows/changelog-unreleased-fold-guard.yml@master
#
# WHY THE TRIGGER LIVES IN THE CALLER, AND WHY IT IS `pull_request`:
# this is the PR-time half of the pair. The post-merge half
# (changelog-fold-guard.yml) runs on a push to master and reports the fold after
# it has already landed. This one computes the merge before it happens.
#
# WHY IT WARNS INSTEAD OF FAILING:
# a blocking check must fail the run, and a failed run mails the operator. On a
# repo with `autoRelease: true` the release is cut on every merge, so a branch
# folds within minutes of going stale and the check fires on nearly every push —
# measured 2026-11-02: 15 genuine folds, 15 failure mails in 29 h. The blocking
# role moved to the consuming repo's `make precommit`, which runs the same script
# before the push and costs nothing when it passes. This job keeps the prediction
# visible on the PR as an annotation.
#
# WHY THE CHECKOUT IS THE PR HEAD AND NOT THE DEFAULT MERGE REF:
# actions/checkout defaults to `github.sha`, which on a pull_request event is the
# forge's own merge commit. The guard must see the branch as it stands and
# compute the merge itself — checking out the pre-merged ref would hand it the
# result it is supposed to predict, and would also make the two sides of
# `git merge-tree` the same commit.
#
# fetch-depth: 0 because `git merge-tree` needs the common ancestor, and because
# the base branch is fetched explicitly below.
#
# The guard *tool* ships from bborbe/coding; this file is only the wiring.

on:
  workflow_call:

jobs:
  changelog-unreleased-fold:
    runs-on: ubuntu-latest
    # The job only reads two repositories and runs a shell script; nothing here
    # writes. Pinning the token keeps a job that checks out untrusted PR-head
    # content from carrying a wider default scope.
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out the guard
        uses: actions/checkout@v4
        with:
          repository: bborbe/coding
          path: .changelog-unreleased-fold-guard

      # `github.base_ref` is only populated on pull_request events, which is the
      # only place this workflow is meant to run. A base ref that cannot be
      # fetched leaves the guard with an unresolvable question, which it fails
      # rather than passes.
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # A WARNING, NOT A FAILURE. A blocking check must fail, and a failed run
      # mails the operator — measured 2026-11-02: 15 stale branches produced 15
      # failure mails in 29 h, every one a genuine fold, because `autoRelease`
      # cuts a release on every merge and a branch folds within minutes of going
      # stale. The fold is caught before the push instead, by the consuming
      # repo's `make precommit`; this job keeps it visible on the PR without
      # producing a mail per push.
      - name: Run the unreleased-fold precheck
        env:
          # The script roots itself at its own repo by default; here the
          # CHANGELOG under test belongs to the calling repo, not to coding.
          CHANGELOG_ROOT: ${{ github.workspace }}
          CHANGELOG_BASE_REF: origin/${{ github.base_ref }}
        run: |
          set +e
          out=$(.changelog-unreleased-fold-guard/scripts/check-changelog-unreleased-fold.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            # One line only: `::warning::` takes a single line, and the script's
            # output is multi-line. `FAIL:` is the verdict line; fall back to a
            # generic phrase so a non-verdict failure (an unfetchable base, a
            # missing CHANGELOG) still surfaces rather than warning blankly.
            detail=$(printf '%s\n' "$out" | grep -m1 '^FAIL:' || true)
            [ -n "$detail" ] || detail='the precheck could not answer; see the step log'
            printf '::warning file=CHANGELOG.md,title=Changelog fold predicted::%s\n' "$detail"
          fi
