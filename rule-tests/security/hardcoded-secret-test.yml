id: go-security/hardcoded-secret
valid:
  - |
    package main

    import "os"

    func main() {
        apiKey := os.Getenv("API_KEY")
        _ = apiKey
        name := "Alice"
        _ = name
    }
invalid:
  - |
    package main

    func main() {
        token := "sk-live-1234567890"
        _ = token
    }
