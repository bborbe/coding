id: go-security/sql-string-interpolation
snapshots:
  ? |
    package main

    import "database/sql"

    func main() {
        db := &sql.DB{}
        ctx := context.Background()
        name := "alice"
        id := "1"
        _ = db.QueryContext(ctx, "SELECT * FROM users WHERE name = '" + name + "'")
        _ = db.Query("SELECT * FROM users WHERE id = " + id)
        _ = db.ExecContext(ctx, "UPDATE users SET name = '" + name + "'")
        _ = db.Exec("DELETE FROM users WHERE id = " + id)
    }
  : labels:
    - source: db.QueryContext(ctx, "SELECT * FROM users WHERE name = '" + name + "'")
      style: primary
      start: 145
      end: 216
    - source: db
      style: secondary
      start: 145
      end: 147
    - source: QueryContext
      style: secondary
      start: 148
      end: 160
    - source: db.QueryContext
      style: secondary
      start: 145
      end: 160
    - source: '"''"'
      style: secondary
      start: 212
      end: 215
    - source: '"SELECT * FROM users WHERE name = ''" + name + "''"'
      style: secondary
      start: 166
      end: 215
    - source: (ctx, "SELECT * FROM users WHERE name = '" + name + "'")
      style: secondary
      start: 160
      end: 216
